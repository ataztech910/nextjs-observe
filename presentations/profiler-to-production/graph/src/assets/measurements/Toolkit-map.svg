<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#101827"/><g font-family="Arial, sans-serif" fill="#f3f6fc"><text x="56" y="70" font-size="30" fill="#7dcbe4">TOOLKIT</text><text x="56" y="130" font-size="47" font-weight="bold">Which tool answers which question?</text><text x="56" y="181" font-size="25" fill="#becbdd">Start from the user question. Then open the tool that can see it.</text><text x="56" y="232" font-size="22" font-weight="bold" fill="#8fa0b8">Question</text><text x="450" y="232" font-size="22" font-weight="bold" fill="#8fa0b8">Open</text><text x="820" y="232" font-size="22" font-weight="bold" fill="#8fa0b8">It shows</text><text x="1160" y="232" font-size="22" font-weight="bold" fill="#8fa0b8">It does not show</text><text x="1450" y="232" font-size="22" font-weight="bold" fill="#8fa0b8">Today</text><rect x="40" y="262" width="1520" height="70" rx="10" fill="#1b2638" opacity="1"/><text x="56" y="306" font-size="23" font-weight="bold">Did the page load well?</text><text x="450" y="306" font-size="23" font-weight="bold" fill="#7dcbe4">Lighthouse</text><text x="820" y="306" font-size="21" fill="#becbdd">the load, in lab conditions</text><text x="1160" y="306" font-size="21" fill="#f0a24b">actions after load</text><text x="1450" y="306" font-size="21" fill="#4cc38a">Web</text><rect x="40" y="344" width="1520" height="70" rx="10" fill="#1b2638" opacity="1"/><text x="56" y="388" font-size="23" font-weight="bold">Did my action work, and when?</text><text x="450" y="388" font-size="23" font-weight="bold" fill="#7dcbe4">Custom instrumentation</text><text x="820" y="388" font-size="21" fill="#becbdd">your endpoint and counts</text><text x="1160" y="388" font-size="21" fill="#f0a24b">why it is slow</text><text x="1450" y="388" font-size="21" fill="#4cc38a">Web · RN</text><rect x="40" y="426" width="1520" height="70" rx="10" fill="#1b2638" opacity="1"/><text x="56" y="470" font-size="23" font-weight="bold">What ran on the main thread?</text><text x="450" y="470" font-size="23" font-weight="bold" fill="#7dcbe4">Chrome DevTools Performance</text><text x="820" y="470" font-size="21" fill="#becbdd">order and cost of browser work</text><text x="1160" y="470" font-size="21" fill="#f0a24b">whether the action worked</text><text x="1450" y="470" font-size="21" fill="#4cc38a">Web</text><rect x="40" y="508" width="1520" height="70" rx="10" fill="#1b2638" opacity="1"/><text x="56" y="552" font-size="23" font-weight="bold">What did React render?</text><text x="450" y="552" font-size="23" font-weight="bold" fill="#7dcbe4">React DevTools Profiler</text><text x="820" y="552" font-size="21" fill="#becbdd">commits of the profiled tree</text><text x="1160" y="552" font-size="21" fill="#f0a24b">JS outside rendering</text><text x="1450" y="552" font-size="21" fill="#4cc38a">RN</text><rect x="40" y="590" width="1520" height="70" rx="10" fill="#1b2638" opacity="1"/><text x="56" y="634" font-size="23" font-weight="bold">Where does JS time go in RN?</text><text x="450" y="634" font-size="23" font-weight="bold" fill="#7dcbe4">Hermes sampling profiler</text><text x="820" y="634" font-size="21" fill="#becbdd">JS functions by sampled time</text><text x="1160" y="634" font-size="21" fill="#f0a24b">call counts, user latency</text><text x="1450" y="634" font-size="21" fill="#4cc38a">RN</text><rect x="40" y="672" width="1520" height="70" rx="10" fill="#1b2638" opacity="0.5"/><text x="56" y="716" font-size="23" font-weight="bold" fill="#8fa0b8">Frames, CPU, RAM on Android?</text><text x="450" y="716" font-size="23" font-weight="bold" fill="#8fa0b8">Flashlight</text><text x="820" y="716" font-size="21" fill="#8fa0b8">a scenario on an Android device</text><text x="1160" y="716" font-size="21" fill="#8fa0b8">iOS — not shown today</text><text x="1450" y="716" font-size="21" fill="#8fa0b8">—</text><rect x="40" y="754" width="1520" height="70" rx="10" fill="#1b2638" opacity="1"/><text x="56" y="798" font-size="23" font-weight="bold">Did it come back after release?</text><text x="450" y="798" font-size="23" font-weight="bold" fill="#7dcbe4">OpenTelemetry → backend</text><text x="820" y="798" font-size="21" fill="#becbdd">your measurements + release</text><text x="1160" y="798" font-size="21" fill="#f0a24b">which metric to choose</text><text x="1450" y="798" font-size="21" fill="#4cc38a">Web · RN</text><text x="56" y="880" font-size="20" fill="#8fa0b8">Flashlight needs Android; the labs in this talk ran on desktop Chrome and the iOS Simulator</text></g></svg>
