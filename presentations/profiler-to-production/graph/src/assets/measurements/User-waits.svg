<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#101827"/><g font-family="Arial, sans-serif" fill="#f3f6fc"><text x="56" y="70" font-size="30" fill="#7dcbe4">WHAT THE USER WAITS FOR</text><text x="56" y="130" font-size="47" font-weight="bold">Which wait are we measuring?</text><text x="56" y="181" font-size="25" fill="#becbdd">Ready to start · Response to an action · Smooth movement</text><rect x="56" y="230" width="468" height="560" rx="18" fill="#1b2638"/><text x="92" y="300" font-size="40" font-weight="bold" fill="#7dcbe4">Opening</text><text x="92" y="350" font-size="25" fill="#becbdd">When can I start using</text><text x="92" y="384" font-size="25" fill="#becbdd">the screen?</text><rect x="566" y="230" width="468" height="560" rx="18" fill="#1b2638"/><text x="602" y="300" font-size="40" font-weight="bold" fill="#f0a24b">Acting</text><text x="602" y="350" font-size="25" fill="#becbdd">When do I see the right</text><text x="602" y="384" font-size="25" fill="#becbdd">result of my input?</text><rect x="1076" y="230" width="468" height="560" rx="18" fill="#1b2638"/><text x="1112" y="300" font-size="40" font-weight="bold" fill="#4cc38a">Moving</text><text x="1112" y="350" font-size="25" fill="#becbdd">Does scrolling or animation</text><text x="1112" y="384" font-size="25" fill="#becbdd">keep going?</text><rect x="210" y="430" width="160" height="290" rx="22" fill="none" stroke="#8fa0b8" stroke-width="4"/><rect x="230" y="460" width="120" height="22" rx="6" fill="#7dcbe4" opacity=".9"/><rect x="230" y="500" width="120" height="60" rx="8" fill="#2a3548"/><rect x="230" y="575" width="120" height="60" rx="8" fill="#2a3548"/><rect x="230" y="655" width="120" height="36" rx="18" fill="#7dcbe4"/><text x="290" y="680" font-size="20" text-anchor="middle" font-weight="bold" fill="#101827">Start</text><rect x="626" y="470" width="150" height="56" rx="28" fill="#f0a24b"/><text x="701" y="507" font-size="24" text-anchor="middle" font-weight="bold" fill="#101827">Tap</text><line x1="791" y1="498" x2="851" y2="498" stroke="#8fa0b8" stroke-width="4" stroke-dasharray="8 8"/><path d="M851 486 l18 12 l-18 12z" fill="#8fa0b8"/><rect x="881" y="450" width="130" height="150" rx="12" fill="none" stroke="#8fa0b8" stroke-width="3"/><rect x="901" y="472" width="90" height="22" rx="6" fill="#f0a24b" opacity="1"/><rect x="901" y="510" width="70" height="22" rx="6" fill="#f0a24b" opacity="0.75"/><rect x="901" y="548" width="50" height="22" rx="6" fill="#f0a24b" opacity="0.5"/><text x="801" y="670" font-size="24" text-anchor="middle" fill="#8fa0b8">how long until the result?</text><rect x="1116" y="560" width="32" height="70" rx="6" fill="#4cc38a" stroke="none" stroke-width="3" stroke-dasharray=""/><rect x="1160" y="560" width="32" height="70" rx="6" fill="#4cc38a" stroke="none" stroke-width="3" stroke-dasharray=""/><rect x="1204" y="560" width="32" height="70" rx="6" fill="#4cc38a" stroke="none" stroke-width="3" stroke-dasharray=""/><rect x="1248" y="560" width="32" height="70" rx="6" fill="#4cc38a" stroke="none" stroke-width="3" stroke-dasharray=""/><rect x="1292" y="560" width="32" height="70" rx="6" fill="#4cc38a" stroke="none" stroke-width="3" stroke-dasharray=""/><rect x="1336" y="560" width="32" height="70" rx="6" fill="none" stroke="#ef6b6b" stroke-width="3" stroke-dasharray="6 6"/><rect x="1380" y="560" width="32" height="70" rx="6" fill="#4cc38a" stroke="none" stroke-width="3" stroke-dasharray=""/><rect x="1424" y="560" width="32" height="70" rx="6" fill="#4cc38a" stroke="none" stroke-width="3" stroke-dasharray=""/><rect x="1468" y="560" width="32" height="70" rx="6" fill="#4cc38a" stroke="none" stroke-width="3" stroke-dasharray=""/><text x="1352" y="680" font-size="24" text-anchor="middle" fill="#ef6b6b">a missed frame</text><text x="1306" y="530" font-size="24" text-anchor="middle" fill="#8fa0b8">one frame after another</text><text x="56" y="850" font-size="30" font-weight="bold">Three different outcomes — one number cannot stand in for all three.</text></g></svg>
