t-weight="bold">&lt;script type="module" async&gt;</text><text x="56" y="682" font-size="22" fill="#8fa0b8">what we test next</text><rect x="506.06060606060606" y="610" width="84.84848484848482" height="60" rx="8" fill="none" stroke="#4cc38a" stroke-width="4" stroke-dasharray="10 8"/><text x="596.969696969697" y="650" font-size="26" font-weight="bold" fill="#4cc38a">? runs as soon as it has loaded</text><line x1="500" x2="1500" y1="740" y2="740" stroke="#8fa0b8" stroke-width="3"/><line x1="500" x2="500" y1="740" y2="752" stroke="#8fa0b8" stroke-width="3"/><text x="500" y="785" font-size="22" text-anchor="middle" fill="#8fa0b8">0 s</text><line x1="803.030303030303" x2="803.030303030303" y1="740" y2="752" stroke="#8fa0b8" stroke-width="3"/><text x="803.030303030303" y="785" font-size="22" text-anchor="middle" fill="#8fa0b8">1 s</text><line x1="1106.060606060606" x2="1106.060606060606" y1="740" y2="752" stroke="#8fa0b8" stroke-width="3"/><text x="1106.060606060606" y="785" font-size="22" text-anchor="middle" fill="#8fa0b8">2 s</text><line x1="1409.090909090909" x2="1409.090909090909" y1="740" y2="752" stroke="#8fa0b8" stroke-width="3"/><text x="1409.090909090909" y="785" font-size="22" text-anchor="middle" fill="#8fa0b8">3 s</text><text x="56" y="840" font-size="27" font-weight="bold">Hypothesis: the code for the visible catalog starts late because the rest of the page is late.</text><text x="56" y="880" font-size="20" fill="#8fa0b8">Schematic, not to measured scale · 3 s artificial delay of the lab scene · script start is not hydration cost</text></g></svg>
